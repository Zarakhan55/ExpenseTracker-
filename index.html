<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css">
    <link rel="stylesheet" href="style.css">
    <title>Expense Tracker</title>
</head>
<body>

<header class="header">
    <div class="brand">
        <div class="logo"><i class="fas fa-wallet"></i></div>

        <div class="header-text">
            <h1>My Expense Tracker</h1>
            <p>Manage your money smarter</p>
        </div>
    </div>
</header>

<main class="dashboard">

    <!-- ===== SUMMARY CARDS ===== -->
    <section class="summary-cards">

        <div class="card balance">
            <div class="card-icon"><i class="fas fa-wallet"></i></div>
            <h3>Total Balance</h3>
            <h2 id="balance">Rs. 0</h2>
            <p>Your available balance</p>
        </div>

        <div class="card income">
            <div class="card-icon"><i class="fas fa-arrow-trend-up"></i></div>
            <h3>Total Income</h3>
            <h2 id="income">Rs. 0</h2>
            <p>Money received</p>
        </div>

        <div class="card expenses">
            <div class="card-icon"><i class="fas fa-arrow-trend-down"></i></div>
            <h3>Total Expenses</h3>
            <h2 id="expense">Rs. 0</h2>
            <p>Money spent</p>
        </div>

    </section>

    <!-- ===== FORM + HISTORY ===== -->
    <div class="dashboard-grid">

        <!-- Add transaction -->
        <section class="panel transaction-section">
            <h2>Add New Transaction</h2>

            <form class="transaction-form" novalidate>
                <div class="form-group">
                    <label for="transactionName">Transaction Name</label>
                    <input
                        type="text"
                        id="transactionName"
                        placeholder="e.g. Groceries"
                        autocomplete="off"
                    >
                </div>

                <div class="form-group">
                    <label for="amount">Amount (Rs.)</label>
                    <input
                        type="number"
                        id="amount"
                        placeholder="Enter amount"
                        min="1"
                        step="any"
                    >
                </div>

                <div class="form-group">
                    <label for="type">Transaction Type</label>
                    <select id="type">
                        <option value="income">Income</option>
                        <option value="expense">Expense</option>
                    </select>
                </div>

                <button type="submit">
                    <i class="fas fa-plus"></i> Add Transaction
                </button>
            </form>
        </section>

        <!-- History -->
        <section class="panel history-section">
            <h2>Transaction History</h2>
            <ul class="transaction-list" id="transactionList"></ul>
        </section>

    </div>

</main>

<script src="script.js"></script>
</body>
</html>
